[project]
name = "proveedor-abierto"
version = "0.1.0"
description = "Investigation app for the Proveedor Abierto case, reading the Ontofill gold export"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn>=0.30",
    "pyyaml>=6",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]

[project.scripts]
pa-app = "proveedor_app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "playwright>=1.47",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/proveedor_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ui: headless-browser smoke tests (need Playwright Chromium)"]

[tool.ruff]
line-length = 110
